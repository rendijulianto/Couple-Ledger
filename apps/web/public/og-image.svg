<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f7f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#dddddd" stroke-width="2"/>
  
  <!-- Logo badge -->
  <rect x="100" y="90" width="72" height="72" rx="20" fill="#ff385c"/>
  <path d="M136 142.5l-2.61-2.376C124.12 131.7 118 126.14 118 119.26c0-5.6 4.41-10 10-10 3.16 0 6.19 1.47 8 3.79 1.81-2.32 4.84-3.79 8-3.79 5.59 0 10 4.4 10 10 0 6.88-6.12 12.44-15.39 20.87L136 142.5z" fill="#ffffff"/>
  
  <!-- Brand text -->
  <text x="190" y="138" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#222222">Cash-book.my.id</text>
  <text x="190" y="162" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#717171">Couple Ledger • Catatan Harian Berdua</text>
  
  <!-- Hero title -->
  <text x="100" y="270" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#222222" letter-spacing="-1">Catat Keuangan Bersama Pasangan</text>
  <text x="100" y="335" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ff385c" letter-spacing="-1">dengan Lebih Transparan</text>
  
  <!-- Subtitle -->
  <text x="100" y="415" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#484848">
    Ruang pencatatan berdua dengan sistem konfirmasi koreksi pasangan,
  </text>
  <text x="100" y="455" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#484848">
    kebijakan tanggal ketat, dan notifikasi real-time bot Telegram.
  </text>
  
  <!-- Feature pills -->
  <g transform="translate(100, 510)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="48" rx="24" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="8" fill="#ff385c"/>
    <text x="44" y="30" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#222222">Konfirmasi Pasangan</text>
    
    <!-- Pill 2 -->
    <rect x="280" y="0" width="240" height="48" rx="24" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
    <circle cx="304" cy="24" r="8" fill="#008489"/>
    <text x="324" y="30" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#222222">Bot Telegram Otomatis</text>
    
    <!-- Pill 3 -->
    <rect x="540" y="0" width="220" height="48" rx="24" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/>
    <circle cx="564" cy="24" r="8" fill="#fc642d"/>
    <text x="584" y="30" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#222222">Bebas Iklan &amp; Aman</text>
