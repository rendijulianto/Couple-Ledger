name: CI & Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Lint
        run: bun run lint

      - name: Run Tests
        run: bun test

  deploy:
    name: Deploy to Production VPS
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Execute Safe Deployment Script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [Deploy] Menuju folder /opt/couple-ledger..."
            cd /opt/couple-ledger

            echo "📥 [Deploy] Mengambil commit terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 [Deploy] Memastikan script deploy executable..."
            chmod +x scripts/*.sh

            # Ambil commit SHA pendek sebagai versi rilis
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "📦 [Deploy] Menjalankan deploy aman dengan versi: ${SHORT_SHA}..."
            ./scripts/deploy.sh "${SHORT_SHA}"

