name: CI & Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_dev
          POSTGRES_PASSWORD: ledger_dev_password
          POSTGRES_DB: couple_ledger_dev
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Lint
        run: bun run lint

      - name: Build Application
        run: bun run build

      - name: Run Database Migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://ledger_dev:ledger_dev_password@localhost:5436/couple_ledger_dev

      - name: Seed Default Categories for Testing
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://ledger_dev:ledger_dev_password@localhost:5436/couple_ledger_dev

      - name: Run Tests
        run: bun test
        env:
          DATABASE_URL: postgresql://ledger_dev:ledger_dev_password@localhost:5436/couple_ledger_dev

  deploy:
    name: Deploy to Production VPS
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH & Execute Safe Deployment Script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [Deploy] Menuju folder /opt/couple-ledger..."
            cd /opt/couple-ledger

            echo "📥 [Deploy] Mengambil commit terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 [Deploy] Memastikan script deploy executable..."
            chmod +x scripts/*.sh

            # Ambil commit SHA pendek sebagai versi rilis
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "📦 [Deploy] Menjalankan deploy aman dengan versi: ${SHORT_SHA}..."
            ./scripts/deploy.sh "${SHORT_SHA}"

